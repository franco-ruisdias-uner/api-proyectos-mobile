name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: verificar (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Buenos_Aires]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar
      - name: El esquema del contrato está al día
        run: git diff --exit-code contrato/esquema.json

  matriz:
    name: e2e ${{ matrix.motor }} (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        motor: [postgres, mysql, mariadb]
        tz: [UTC, America/Argentina/Buenos_Aires]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U api -d api" --health-interval 3s --health-timeout 3s --health-retries 40
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: api, MYSQL_PASSWORD: api, MYSQL_DATABASE: api }
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uapi -papi" --health-interval 3s --health-timeout 3s --health-retries 60
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_USER: api, MARIADB_PASSWORD: api, MARIADB_DATABASE: api }
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 3s --health-timeout 3s --health-retries 60
    env:
      TZ: ${{ matrix.tz }}
      MATRIZ_SIN_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:matriz ${{ matrix.motor }}

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probar-docker.mjs
