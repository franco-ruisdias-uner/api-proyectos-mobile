name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: verificar (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Buenos_Aires]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar

  matriz:
    name: e2e ${{ matrix.motor }} (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        motor: [postgres, mysql, mariadb]
        tz: [UTC, America/Argentina/Buenos_Aires]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U api -d api" --health-interval 2s --health-timeout 3s --health-retries 60
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: api, MYSQL_USER: api, MYSQL_PASSWORD: api }
        ports: ['53306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uapi -papi" --health-interval 2s --health-timeout 3s --health-retries 90
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: api, MARIADB_USER: api, MARIADB_PASSWORD: api }
        ports: ['53307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 3s --health-retries 90
    env:
      TZ: ${{ matrix.tz }}
      MATRIZ_SIN_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/matriz.mjs ${{ matrix.motor }}

  almacen-s3:
    name: archivos sobre S3 (S3Proxy)
    runs-on: ubuntu-latest
    services:
      s3:
        image: andrewgaul/s3proxy:sha-9a9b1ee
        env:
          S3PROXY_ENDPOINT: http://0.0.0.0:8080
          S3PROXY_AUTHORIZATION: none
          JCLOUDS_PROVIDER: transient
        ports: ['58080:8080']
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      MATRIZ_SIN_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/matriz.mjs almacen-s3

  docker:
    name: docker compose (los cuatro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probar-docker.mjs
