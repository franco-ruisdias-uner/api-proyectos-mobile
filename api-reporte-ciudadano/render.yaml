# Blueprint de Render (AGENTS §18.2): la API publicada desde el Dockerfile, plan gratis.
# Los valores con `sync: false` los pide Render al crear el servicio (no van al repo).
services:
  - type: web
    name: api-reporte-ciudadano
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: publicado
      - key: CONFIAR_PROXY
        value: "true"
      - key: DB_PROVEEDOR
        value: supabase
      - key: ARCHIVOS_PROVEEDOR
        value: supabase
      - key: SEMBRAR_SI_VACIA
        value: "true"
      - key: DB_SINCRONIZAR
        value: "true"
      - key: NOTIFICACIONES
        value: expo
      - key: SIMULACION_HABILITADA
        value: "false"
      - key: DB_URL
        sync: false
      - key: JWT_SECRETO
        sync: false
      - key: SUPABASE_PROYECTO
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
