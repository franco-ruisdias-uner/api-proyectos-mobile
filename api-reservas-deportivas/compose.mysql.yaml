# `docker compose -f compose.mysql.yaml up`: la API con MySQL 8.4.
name: api-reservas-deportivas-mysql
services:
  api:
    extends: { file: compose.yaml, service: api }
    environment:
      DB_MOTOR: mysql
      DB_URL: mysql://api:api@mysql:3306/api
    depends_on:
      mysql: { condition: service_healthy }
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: api, MYSQL_DATABASE: api, MYSQL_USER: api, MYSQL_PASSWORD: api }
    ports: ["${PUERTO_DB:-3307}:3306"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapi", "-papi"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  datos:
  archivos:
  mysql:
