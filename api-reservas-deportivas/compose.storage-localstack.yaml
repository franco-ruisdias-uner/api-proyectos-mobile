# Se suma a cualquier compose de la sección 16 (AGENTS §17.3). "AWS local":
#   LOCALSTACK_AUTH_TOKEN=… docker compose -f compose.postgres.yaml -f compose.storage-localstack.yaml up
# LocalStack pide cuenta y token (plan gratis para uso no comercial): https://app.localstack.cloud
services:
  api:
    environment:
      ARCHIVOS_PROVEEDOR: localstack
      ARCHIVOS_CREAR_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: clave-de-mentira
    depends_on:
      localstack: { condition: service_healthy }
  localstack:
    image: localstack/localstack:2026.09.0
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN. Sacalo gratis en https://app.localstack.cloud (Auth Tokens) y repetí el comando.}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 40
