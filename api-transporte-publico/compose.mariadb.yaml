# docker compose -f compose.mariadb.yaml up → API + MariaDB 11 con los datos de demo.
name: api-transporte-publico-mariadb
services:
  api:
    extends: { file: compose.yaml, service: api }
    environment:
      DB_MOTOR: mariadb
      DB_URL: mysql://api:api@mariadb:3306/api
    depends_on:
      mariadb: { condition: service_healthy }
  mariadb:
    image: mariadb:11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: api
      MARIADB_USER: api
      MARIADB_PASSWORD: api
    ports: ["${PUERTO_DB:-3308}:3306"]
    volumes: [mariadb:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  datos:
  archivos:
  mariadb:
