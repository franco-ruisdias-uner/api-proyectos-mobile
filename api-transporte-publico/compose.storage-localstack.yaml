# Se suma a cualquier compose: los archivos van a LocalStack ("AWS local").
# LocalStack pide cuenta y un token (gratis para uso no comercial):
#   LOCALSTACK_AUTH_TOKEN=… docker compose -f compose.postgres.yaml -f compose.storage-localstack.yaml up
services:
  api:
    environment:
      ARCHIVOS_PROVEEDOR: localstack
      ARCHIVOS_CREAR_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: secreto-de-mentira
    depends_on:
      localstack: { condition: service_healthy }
  localstack:
    image: localstack/localstack:2026.8.5
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN. Conseguilo gratis en https://app.localstack.cloud (plan para uso no comercial) y volvé a correr el comando con LOCALSTACK_AUTH_TOKEN=…}"
    ports: ["${PUERTO_LOCALSTACK:-4566}:4566"]
    volumes: [almacen-localstack:/var/lib/localstack]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  almacen-localstack:
