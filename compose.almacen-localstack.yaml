# Se suma a cualquier compose: los archivos van a LocalStack ("AWS local").
# LocalStack pide cuenta y un token (gratis para uso no comercial): https://app.localstack.cloud
#   LOCALSTACK_AUTH_TOKEN=… docker compose -f compose.yaml -f compose.almacen-localstack.yaml up
services:
  localstack:
    image: localstack/localstack:2026.10.0
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN. Creá una cuenta gratis en https://app.localstack.cloud y copiá el token}"
    volumes:
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 40
  api:
    environment:
      STORAGE_PROVIDER: localstack
      S3_CREATE_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: clave-de-mentira
    depends_on:
      localstack: { condition: service_healthy }
volumes:
  localstackdata:
