# Se SUMA a cualquiera de los compose de la API: los archivos quedan en LocalStack ("AWS local").
# LocalStack pide una cuenta gratis y un token (https://app.localstack.cloud → Auth Tokens):
#   LOCALSTACK_AUTH_TOKEN=ls-… docker compose -f compose.postgres.yaml -f compose.almacen-localstack.yaml up
# Si no querés crear una cuenta, usá compose.almacen-s3.yaml (S3Proxy), que no pide nada.
services:
  api:
    environment:
      ARCHIVOS_PROVEEDOR: localstack
      ARCHIVOS_CREAR_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: secreto-de-mentira
    depends_on:
      localstack: { condition: service_healthy }
  localstack:
    image: localstack/localstack:2026.08.4
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN. Creá una cuenta gratis en https://app.localstack.cloud, copiá el token y volvé a correr el comando con LOCALSTACK_AUTH_TOKEN=<tu token>. Si no querés cuenta, usá compose.almacen-s3.yaml.}"
    ports: ["${PUERTO_S3:-4566}:4566"]
    volumes: [almacen-localstack:/var/lib/localstack]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 60
volumes:
  almacen-localstack:
