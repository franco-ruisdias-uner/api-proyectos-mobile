# Se SUMA a cualquiera de los otros compose: "AWS local" con LocalStack.
# LocalStack pide una cuenta (gratis para uso no comercial) y su token:
#   LOCALSTACK_AUTH_TOKEN=... docker compose -f compose.postgres.yaml -f compose.almacen-localstack.yaml up
services:
  api:
    environment:
      ARCHIVOS_PROVEEDOR: localstack
      ARCHIVOS_CREAR_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: clave-de-mentira
    depends_on:
      localstack: { condition: service_healthy }
  localstack:
    image: localstack/localstack:2026.9.0
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN. Sacá una cuenta gratis en https://app.localstack.cloud y copiá el token.}"
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 3s
      timeout: 5s
      retries: 40
