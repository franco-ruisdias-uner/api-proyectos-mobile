# Se SUMA a cualquiera de los otros compose: guarda las fotos en S3Proxy (un S3 de juguete).
#   docker compose -f compose.yaml -f compose.almacen-s3.yaml up
#   docker compose -f compose.postgres.yaml -f compose.almacen-s3.yaml up
services:
  api:
    environment:
      ARCHIVOS_PROVEEDOR: s3proxy
      ARCHIVOS_CREAR_BUCKET: "true"
      S3_BUCKET: archivos
      S3_ACCESS_KEY_ID: clave-de-mentira
      S3_SECRET_ACCESS_KEY: clave-de-mentira
    depends_on:
      s3: { condition: service_healthy }
  s3:
    image: andrewgaul/s3proxy:s3proxy-4.1.1
    environment:
      S3PROXY_AUTHORIZATION: none
      S3PROXY_ENDPOINT: http://0.0.0.0:8080
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    volumes: [s3:/data]
    ports: ["${PUERTO_S3:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  s3:
