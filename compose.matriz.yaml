# Sólo para los tests (`pnpm test:e2e:matriz`): las tres bases en tmpfs (rápidas y
# descartables), en puertos que no chocan con nada, más S3Proxy (un S3 de juguete, sin
# volumen) en el 58080 para probar el adaptador de archivos S3.
name: api-directorio-comercios-matriz
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: api, MYSQL_PASSWORD: api, MYSQL_DATABASE: api }
    ports: ["53306:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapi -papi"]
      interval: 2s
      timeout: 3s
      retries: 90
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: root, MARIADB_USER: api, MARIADB_PASSWORD: api, MARIADB_DATABASE: api }
    ports: ["53307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90
  s3:
    image: andrewgaul/s3proxy:s3proxy-4.1.1
    environment:
      S3PROXY_AUTHORIZATION: none
      S3PROXY_ENDPOINT: http://0.0.0.0:8080
      JCLOUDS_PROVIDER: transient
    ports: ["58080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 3s
      retries: 60
