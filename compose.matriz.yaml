# Bases para `pnpm test:e2e:matriz` (y S3Proxy para los tests de archivos del módulo «Nube»).
# En tmpfs: rápidas y descartables. No es para usar la API: para eso están los otros compose.
name: api-mi-ciudad-matriz
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: raiz, MYSQL_USER: api, MYSQL_PASSWORD: api, MYSQL_DATABASE: api }
    ports: ["53306:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapi -papi"]
      interval: 2s
      timeout: 3s
      retries: 90
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: raiz, MARIADB_USER: api, MARIADB_PASSWORD: api, MARIADB_DATABASE: api }
    ports: ["53307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90
  s3:
    image: andrewgaul/s3proxy:4.1.1
    environment:
      S3PROXY_AUTHORIZATION: none
      JCLOUDS_PROVIDER: transient
    ports: ["58080:80"]
