# Sólo para los tests (`pnpm test:e2e:matriz`): las tres bases en tmpfs (rápidas y
# descartables), en puertos que no chocan con nada. S3Proxy se suma con el módulo «Nube»,
# cuando haya un adaptador S3 que probar.
name: api-directorio-comercios-matriz
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: api, MYSQL_PASSWORD: api, MYSQL_DATABASE: api }
    ports: ["53306:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapi -papi"]
      interval: 2s
      timeout: 3s
      retries: 90
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: root, MARIADB_USER: api, MARIADB_PASSWORD: api, MARIADB_DATABASE: api }
    ports: ["53307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90
