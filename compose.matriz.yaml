# Sólo las bases, en tmpfs, para `pnpm test:e2e:matriz` (AGENTS §10.4).
# S3Proxy se suma con el módulo «Nube», junto con el adaptador S3.
name: api-transporte-publico-matriz
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: api, MYSQL_USER: api, MYSQL_PASSWORD: api }
    ports: ["53306:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapi -papi"]
      interval: 2s
      timeout: 3s
      retries: 90
  mariadb:
    image: mariadb:11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: api, MARIADB_USER: api, MARIADB_PASSWORD: api }
    ports: ["53307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90
