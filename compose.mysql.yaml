# La API con MySQL 8.4. La base se ve desde la compu en el puerto 3307 (usuario y clave: api).
name: api-lectura-medidores-mysql
services:
  api:
    extends: { file: compose.yaml, service: api }
    environment:
      DB_ENGINE: mysql
      DB_URL: mysql://api:api@mysql:3306/api
    depends_on:
      mysql: { condition: service_healthy }
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: api, MYSQL_DATABASE: api, MYSQL_USER: api, MYSQL_PASSWORD: api }
    ports: ["${DB_PORT:-3307}:3306"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapi", "-papi"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  data:
  uploads:
  mysql:
