# Blueprint de Render: API desde el Dockerfile, con la base y los archivos en Supabase.
# Los secretos (sync: false) los pide Render al crear el servicio; ver README, sección 9.
services:
  - type: web
    name: api-mi-ciudad
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: publicado
      - key: CONFIAR_PROXY
        value: "true"
      - key: DB_PROVEEDOR
        value: supabase
      - key: ARCHIVOS_PROVEEDOR
        value: supabase
      - key: SEMBRAR_SI_VACIA
        value: "true"
      - key: DB_SINCRONIZAR
        value: "true"
      - key: NOTIFICACIONES
        value: expo
      - key: SIMULACION_HABILITADA
        value: "false"
      - key: DB_URL
        sync: false
      - key: JWT_SECRETO
        generateValue: true
      - key: SUPABASE_PROYECTO
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
